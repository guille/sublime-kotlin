syntax: "Kotlin.sublime-syntax"
comment_char: "//"
tests:
  - line: 'fun greet(name: String): String = "Hi, $name"'
    assertions:
      - span: "fun"
        scopes: [keyword.declaration.function.kotlin]
      - span: "greet"
        scopes: [meta.function.kotlin, entity.name.function.kotlin]
      - span: "name"
        scopes: [meta.function.parameters.kotlin, variable.parameter.kotlin]
      - span: "String"
        nth: 0
        scopes: [meta.type.kotlin, support.type.kotlin]
      - span: "String"
        nth: 1
        scopes: [meta.type.kotlin, support.type.kotlin]
      - span: "="
        scopes: [keyword.operator.assignment.kotlin]
      - span: "$name"
        scopes: [meta.string.kotlin, string.quoted.double.kotlin, variable.other.interpolated.kotlin]

  - line: "fun String.lastChar(): Char = this[length - 1]"
    assertions:
      - span: "fun"
        scopes: [keyword.declaration.function.kotlin]
      - span: "String"
        scopes: [meta.function.kotlin, support.type.kotlin]
      - span: "."
        nth: 0
        scopes: [meta.function.kotlin, punctuation.accessor.dot.kotlin]
      - span: "lastChar"
        scopes: [meta.function.kotlin, entity.name.function.kotlin]
      - span: "Char"
        nth: 1
        scopes: [meta.type.kotlin, support.type.kotlin]
      - span: "this"
        scopes: [variable.language.kotlin]
      - span: "["
        scopes: [punctuation.section.brackets.begin.kotlin]
      - span: "length"
        scopes: [variable.other.readwrite.kotlin]
      - span: "-"
        scopes: [keyword.operator.arithmetic.kotlin]
      - span: "1"
        scopes: [constant.numeric.integer.decimal.kotlin]
      - span: "]"
        scopes: [punctuation.section.brackets.end.kotlin]

  - line: "val String.firstLetter: Char get() = this[0]"
    assertions:
      - span: "val"
        scopes: [keyword.declaration.kotlin]
      - span: "String"
        scopes: [meta.declaration.variable.kotlin, support.type.kotlin]
      - span: "."
        nth: 0
        scopes: [meta.declaration.variable.kotlin, punctuation.accessor.dot.kotlin]
      - span: "firstLetter"
        scopes: [meta.declaration.variable.kotlin, variable.other.readwrite.kotlin]
      - span: "Char"
        scopes: [meta.type.kotlin, support.type.kotlin]
      - span: "get"
        scopes: [keyword.declaration.kotlin]
      - span: "this"
        scopes: [variable.language.kotlin]

  - line: "fun <T> identity(value: T): T = value"
    assertions:
      - span: "<"
        scopes: [meta.type.parameters.kotlin, punctuation.definition.typeparameters.begin.kotlin]
      - span: "T"
        nth: 0
        scopes: [meta.type.parameters.kotlin, support.type.kotlin]
      - span: ">"
        scopes: [meta.type.parameters.kotlin, punctuation.definition.typeparameters.end.kotlin]
      - span: "identity"
        scopes: [meta.function.kotlin, entity.name.function.kotlin]
      - span: "value"
        nth: 0
        scopes: [meta.function.parameters.kotlin, variable.parameter.kotlin]
      - span: "T"
        nth: 1
        scopes: [meta.type.kotlin, support.type.kotlin]
      - span: "T"
        nth: 2
        scopes: [meta.type.kotlin, support.type.kotlin]
      - span: "value"
        nth: 1
        scopes: [variable.other.readwrite.kotlin]

  - line: "fun accepts(block: (Int) -> String) {}"
    assertions:
      - span: "block"
        scopes: [meta.function.parameters.kotlin, variable.parameter.kotlin]
      - span: "Int"
        scopes: [meta.type.kotlin, support.type.kotlin]
      - span: "->"
        scopes: [meta.type.kotlin, punctuation.separator.return-type.kotlin]
      - span: "String"
        scopes: [meta.type.kotlin, support.type.kotlin]
      - span: "{"
        scopes: [punctuation.section.block.begin.kotlin]
      - span: "}"
        scopes: [punctuation.section.block.end.kotlin]

  - line: "val answer: Int by lazy { 42 }"
    assertions:
      - span: "answer"
        scopes: [meta.declaration.variable.kotlin, variable.other.readwrite.kotlin]
      - span: "Int"
        scopes: [meta.type.kotlin, support.type.kotlin]
      - span: "by"
        scopes: [keyword.operator.word.kotlin]
      - span: "42"
        scopes: [constant.numeric.integer.decimal.kotlin]

  - line: "val entry: Map.Entry<String, Int>? = null"
    assertions:
      - span: "entry"
        scopes: [meta.declaration.variable.kotlin, variable.other.readwrite.kotlin]
      - span: "Map"
        scopes: [meta.type.kotlin, support.type.kotlin]
      - span: "."
        nth: 0
        scopes: [meta.type.kotlin, punctuation.accessor.dot.kotlin]
      - span: "Entry"
        scopes: [meta.type.kotlin, support.type.kotlin]
      - span: "<"
        scopes: [meta.type.parameters.kotlin, punctuation.definition.typeparameters.begin.kotlin]
      - span: "String"
        scopes: [meta.type.kotlin, support.type.kotlin]
      - span: "Int"
        scopes: [meta.type.kotlin, support.type.kotlin]
      - span: ">"
        scopes: [meta.type.parameters.kotlin, punctuation.definition.typeparameters.end.kotlin]
      - span: "?"
        scopes: [meta.type.kotlin, keyword.operator.nullable.kotlin]
      - span: "null"
        scopes: [constant.language.null.kotlin]

  - line: "val sure: T & Any = value"
    assertions:
      - span: "sure"
        scopes: [meta.declaration.variable.kotlin, variable.other.readwrite.kotlin]
      - span: "T"
        scopes: [meta.type.kotlin, support.type.kotlin]
      - span: "&"
        scopes: [meta.type.kotlin, keyword.operator.type.intersection.kotlin]
      - span: "Any"
        scopes: [meta.type.kotlin, support.type.kotlin]

  - line: "class Child : Parent(), Interface"
    assertions:
      - span: "Child"
        scopes: [meta.class.kotlin, entity.name.class.kotlin]
      - span: ":"
        scopes: [punctuation.separator.type.kotlin]
      - span: "Parent"
        scopes: [meta.type.kotlin, support.type.kotlin]
      - span: "Interface"
        scopes: [meta.type.kotlin, support.type.kotlin]

  # Parenthesized function type as extension receiver.
  - line: "infix fun <A, B, C> ((B) -> C).compose(other: (A) -> B): (A) -> C = { this(other(it)) }"
    assertions:
      - span: "(("
        scopes: [meta.function.kotlin, meta.type.kotlin, meta.group.kotlin, punctuation.section.group.begin.kotlin, "- meta.function.parameters"]
      - span: "B"
        nth: 1
        scopes: [meta.type.kotlin, support.type.kotlin, "- variable.parameter"]
      - span: "->"
        nth: 0
        scopes: [meta.type.kotlin, punctuation.separator.return-type.kotlin]
      - span: "C"
        nth: 1
        scopes: [meta.type.kotlin, support.type.kotlin]
      - span: ")."
        scopes: [meta.function.kotlin]
      - span: "compose"
        scopes: [meta.function.kotlin, entity.name.function.kotlin]
      - span: "other"
        nth: 0
        scopes: [meta.function.parameters.kotlin, variable.parameter.kotlin]

  - line: "fun (x: Int) = x"
    assertions:
      - span: "("
        scopes: [meta.function.parameters.kotlin, punctuation.section.parameters.begin.kotlin]
      - span: "x"
        nth: 0
        scopes: [variable.parameter.kotlin]


  # A generic call with a trailing lambda.
  - line: "assertFailsWith<WebSocketException> {"
    assertions:
      - span: "assertFailsWith"
        scopes: [variable.function.kotlin, "- meta.type"]
      - span: "<"
        scopes: [meta.type.parameters.kotlin, punctuation.definition.typeparameters.begin.kotlin]
      - span: "WebSocketException"
        scopes: [meta.type.kotlin, support.type.kotlin]
      - span: "{"
        scopes: [meta.lambda.kotlin, punctuation.section.block.begin.kotlin]

  - line: "    f()"
    assertions:
      - span: "f"
        scopes: [meta.lambda.kotlin, variable.function.kotlin]

  - line: "}"
    assertions:
      - span: "}"
        scopes: [meta.lambda.kotlin, punctuation.section.block.end.kotlin]

  - line: "plugins.withType<NodeJsPlugin> { the<X>() }"
    assertions:
      - span: "withType"
        scopes: [variable.function.kotlin]
      - span: "{"
        scopes: [meta.lambda.kotlin]
      - span: "the"
        scopes: [meta.lambda.kotlin, variable.function.kotlin]
      - span: "X"
        scopes: [meta.type.kotlin, support.type.kotlin]

  - line: "run { get<Articles> { call.respond(it) } }"
    assertions:
      - span: "get"
        scopes: [variable.function.kotlin, "- meta.type"]
      - span: "Articles"
        scopes: [support.type.kotlin]
      - span: "it"
        scopes: [meta.lambda.kotlin meta.lambda.kotlin, variable.language.kotlin]
      - span: "{"
        nth: 1
        scopes: [meta.lambda.kotlin meta.lambda.kotlin, "- meta.block"]

  - line: "ReadWriteProperty<Any?, Double> {}"
    assertions:
      - span: "ReadWriteProperty"
        scopes: [variable.function.kotlin]
      - span: "{"
        scopes: [meta.lambda.kotlin]

  - prefix_lines: ["val d = object :"]
    line: "    ReadWriteProperty<Any?, Double> {}"
    assertions:
      - span: "ReadWriteProperty"
        scopes: [meta.type.kotlin, support.type.kotlin]
      - span: "{"
        scopes: ["- meta.lambda"]

  # Callable references on generic types.
  - line: "val g = FlowCollector<Any?>::emit"
    assertions:
      - span: "FlowCollector"
        scopes: [meta.type.kotlin, support.type.kotlin]
      - span: "Any"
        scopes: [meta.type.kotlin, support.type.kotlin]
      - span: "?"
        scopes: [keyword.operator.nullable.kotlin]
      - span: "::"
        scopes: [punctuation.accessor.callable-reference.kotlin]
      - span: "emit"
        scopes: [variable.function.kotlin]

  - line: "val c = List<String>::class"
    assertions:
      - span: "List"
        scopes: [support.type.kotlin]
      - span: "class"
        scopes: [keyword.other.kotlin]

  - line: "val b = a < b && c > ::d"
    assertions:
      - span: "a"
        nth: 1
        scopes: [variable.other.readwrite.kotlin, "- support.type"]
