syntax: "Kotlin.sublime-syntax"
comment_char: "//"
tests:
  # Default parameter values are expressions, not parameter names.
  - line: "fun f(cause: Ex? = null, b: Int = g(1, 2), c: () -> Unit = { x -> x }) {}"
    assertions:
      - span: "cause"
        scopes: [meta.function.parameters.kotlin, variable.parameter.kotlin]
      - span: "null"
        scopes: [meta.function.parameters.kotlin, constant.language.null.kotlin, "- variable.parameter"]
      - span: "b"
        scopes: [variable.parameter.kotlin]
      - span: "g"
        scopes: [meta.function.parameters.kotlin, variable.function.kotlin]
      - span: "1"
        scopes: [constant.numeric.integer.decimal.kotlin, "- variable.parameter"]
      - span: "2"
        scopes: [constant.numeric.integer.decimal.kotlin, "- variable.parameter"]
      - span: "c"
        scopes: [variable.parameter.kotlin]
      - span: "{"
        scopes: [meta.lambda.kotlin, punctuation.section.block.begin.kotlin]
      - span: "x"
        nth: 1
        scopes: [meta.lambda.kotlin, variable.parameter.kotlin]
      - span: "x"
        nth: 2
        scopes: [meta.lambda.kotlin, variable.other.readwrite.kotlin]
      - span: "}"
        nth: 0
        scopes: [meta.lambda.kotlin, punctuation.section.block.end.kotlin]
      - span: ")"
        nth: 2
        scopes: [punctuation.section.parameters.end.kotlin, "- meta.lambda"]

  - line: "class C(val a: Int = null, var b: String = name)"
    assertions:
      - span: "a"
        nth: 2
        scopes: [variable.parameter.kotlin]
      - span: "null"
        scopes: [constant.language.null.kotlin, "- variable.parameter"]
      - span: "b"
        scopes: [variable.parameter.kotlin]
      - span: "name"
        scopes: [variable.other.readwrite.kotlin, "- variable.parameter"]
      - span: ")"
        scopes: [punctuation.section.parameters.end.kotlin]

  - line: "fun f(x: Int = 1) = x"
    assertions:
      - span: "1"
        scopes: [meta.function.parameters.kotlin, constant.numeric.integer.decimal.kotlin]
      - span: ")"
        scopes: [punctuation.section.parameters.end.kotlin]
      - span: "= x"
        scopes: ["- meta.function.parameters"]

  # `when { a -> }` inside a lambda isn't a lambda parameter list, and its
  # braces don't close the lambda.
  - prefix_lines: ["run {", "    val j = when {"]
    line: "        a -> 1"
    assertions:
      - span: "a"
        scopes: [meta.lambda.kotlin, variable.other.readwrite.kotlin, "- variable.parameter"]
      - span: "a"
        scopes: ["- meta.block"]
      - span: "->"
        scopes: [punctuation.separator.when.kotlin, "- keyword.declaration.function.arrow"]

  - line: "        else -> 2"
    assertions:
      - span: "else"
        scopes: [keyword.control.conditional.kotlin, "- variable.parameter"]
      - span: "->"
        scopes: [punctuation.separator.when.kotlin]

  - prefix_lines: ["    }"]
    line: "}"
    assertions:
      - span: "}"
        scopes: [meta.lambda.kotlin, punctuation.section.block.end.kotlin]

  - line: "x"
    assertions:
      - span: "x"
        scopes: ["- meta.lambda"]

  # Lambda parameters are only recognised at the start of the lambda.
  - line: "list.fold(0) { acc, v -> foo(a, b) }"
    assertions:
      - span: "acc"
        scopes: [variable.parameter.kotlin]
      - span: "v"
        scopes: [variable.parameter.kotlin]
      - span: "->"
        scopes: [keyword.declaration.function.arrow.kotlin]
      - span: "a"
        nth: 1
        scopes: [variable.other.readwrite.kotlin, "- variable.parameter"]

  - prefix_lines: ["list.map {"]
    line: "    x, y -> x"
    assertions:
      - span: "x"
        nth: 0
        scopes: [meta.lambda.kotlin, variable.parameter.kotlin]
      - span: "y"
        scopes: [variable.parameter.kotlin]
      - span: "->"
        scopes: [keyword.declaration.function.arrow.kotlin]

  - line: "}"
    assertions:
      - span: "}"
        scopes: [meta.lambda.kotlin, punctuation.section.block.end.kotlin]

  - line: "run { foo(a, b) }"
    assertions:
      - span: "a"
        scopes: [meta.lambda.kotlin, variable.other.readwrite.kotlin, "- variable.parameter"]
      - span: "}"
        scopes: [meta.lambda.kotlin, punctuation.section.block.end.kotlin]

  # `it` anywhere inside a lambda, including nested groups.
  - line: "run { foo(it.x) }"
    assertions:
      - span: "it"
        scopes: [meta.lambda.kotlin, variable.language.kotlin]
      - span: "x"
        scopes: [variable.other.readwrite.kotlin]

  - line: "subprojects.filter { !unpublished.contains(it.name) && it.name !in sourceless }"
    assertions:
      - span: "it"
        nth: 0
        scopes: [variable.language.kotlin]
      - span: "it"
        nth: 1
        scopes: [variable.language.kotlin]
      - span: "!in"
        scopes: [keyword.operator.word.kotlin]

  - line: "list.map { listOf(it[0], arrayOf(it)) }"
    assertions:
      - span: "it"
        nth: 0
        scopes: [variable.language.kotlin]
      - span: "it"
        nth: 1
        scopes: [variable.language.kotlin]

  - line: "val item = items"
    assertions:
      - span: "item"
        scopes: [variable.other.readwrite.kotlin, "- variable.language"]
      - span: "items"
        scopes: [variable.other.readwrite.kotlin, "- variable.language"]

  # Typed lambda parameters: `->` ends the parameter type.
  - line: "val g = { x: Int -> foo(x) }"
    assertions:
      - span: "{"
        scopes: [meta.lambda.kotlin, punctuation.section.block.begin.kotlin]
      - span: "x"
        nth: 0
        scopes: [meta.lambda.kotlin, variable.parameter.kotlin]
      - span: "Int"
        scopes: [meta.type.kotlin, support.type.kotlin]
      - span: "->"
        scopes: [keyword.declaration.function.arrow.kotlin, "- meta.type"]
      - span: "foo"
        scopes: [variable.function.kotlin, "- meta.type", "- support.type"]
      - span: "x"
        nth: 1
        scopes: [variable.other.readwrite.kotlin, "- meta.type", "- meta.group"]
      - span: "}"
        scopes: [meta.lambda.kotlin, punctuation.section.block.end.kotlin]

  - line: "val handler = { e: Throwable ->"
    assertions:
      - span: "e"
        nth: 1
        scopes: [meta.lambda.kotlin, variable.parameter.kotlin]
      - span: "{ e"
        scopes: [meta.lambda.kotlin]
      - span: "Throwable"
        scopes: [meta.type.kotlin, support.type.kotlin]
      - span: "->"
        scopes: [keyword.declaration.function.arrow.kotlin]

  - line: '    assertTrue(e is Ex && e.cause is TestEx, "$e")'
    assertions:
      - span: "assertTrue"
        scopes: [meta.lambda.kotlin, variable.function.kotlin, "- meta.type"]
      - span: "&&"
        scopes: [keyword.operator.logical.kotlin, "- meta.type"]
      - span: "Ex"
        scopes: [meta.type.kotlin, support.type.kotlin]
      - span: '"'
        nth: 0
        scopes: [punctuation.definition.string.begin.kotlin, "- meta.type"]

  - line: "}"
    assertions:
      - span: "}"
        scopes: [meta.lambda.kotlin, punctuation.section.block.end.kotlin]

  - line: "list.map { x: Int, y: List<String> -> x }"
    assertions:
      - span: "x"
        nth: 0
        scopes: [variable.parameter.kotlin]
      - span: ","
        scopes: [punctuation.separator.sequence.kotlin, "- meta.type"]
      - span: "y"
        scopes: [variable.parameter.kotlin]
      - span: "String"
        scopes: [meta.type.kotlin, support.type.kotlin]
      - span: "->"
        scopes: [keyword.declaration.function.arrow.kotlin]
      - span: "x"
        nth: 1
        scopes: [variable.other.readwrite.kotlin]

  - line: "fun f() = { a: Int -> a }"
    assertions:
      - span: "{"
        scopes: [meta.lambda.kotlin]
      - span: "a"
        nth: 0
        scopes: [variable.parameter.kotlin]

  - line: "val n: Int = 1"
    assertions:
      - span: "1"
        scopes: [constant.numeric.integer.decimal.kotlin, "- meta.lambda"]

  # Function types still take `->` after their parameter group.
  - line: "val f: (Int) -> Unit = {}"
    assertions:
      - span: "->"
        scopes: [meta.type.kotlin, punctuation.separator.return-type.kotlin]
      - span: "Unit"
        scopes: [meta.type.kotlin, support.type.kotlin]
      - span: "{"
        scopes: [meta.lambda.kotlin]

  - line: "val h: suspend Foo.() -> Unit"
    assertions:
      - span: "->"
        scopes: [meta.type.kotlin, punctuation.separator.return-type.kotlin]
      - span: "Unit"
        scopes: [meta.type.kotlin, support.type.kotlin]

  - line: "val k: ((Int) -> String)? = null"
    assertions:
      - span: "->"
        scopes: [meta.type.kotlin, meta.group.kotlin, punctuation.separator.return-type.kotlin]
      - span: "?"
        scopes: [meta.type.kotlin, keyword.operator.nullable.kotlin]
      - span: "null"
        scopes: [constant.language.null.kotlin]

  # Destructured lambda parameters.
  - line: "list.forEach { (k, v): Map.Entry<String, Int> -> k && v }"
    assertions:
      - span: "k"
        nth: 0
        scopes: [meta.lambda.kotlin, variable.parameter.kotlin]
      - span: "v"
        nth: 0
        scopes: [variable.parameter.kotlin]
      - span: "Entry"
        scopes: [meta.type.kotlin, support.type.kotlin]
      - span: "->"
        scopes: [keyword.declaration.function.arrow.kotlin, "- meta.type"]
      - span: "k"
        nth: 1
        scopes: [variable.other.readwrite.kotlin, "- meta.type"]
      - span: "&&"
        scopes: [keyword.operator.logical.kotlin, "- keyword.operator.type"]

  - line: "map.map { (key, value), i -> key }"
    assertions:
      - span: "key"
        nth: 0
        scopes: [variable.parameter.kotlin]
      - span: "value"
        scopes: [variable.parameter.kotlin]
      - span: "i"
        scopes: [variable.parameter.kotlin]
      - span: "key"
        nth: 1
        scopes: [variable.other.readwrite.kotlin]

  - line: "run { (a + b) * 2 }"
    assertions:
      - span: "a"
        scopes: [variable.other.readwrite.kotlin, "- variable.parameter"]
      - span: "*"
        scopes: [keyword.operator.arithmetic.kotlin]

  # Body tokens after a typed parameter keep their own scopes.
  - line: "obj.call { x: Int, y: String -> if (x > 0 && y == \"a\") 'c' else this@call }"
    assertions:
      - span: "x"
        nth: 0
        scopes: [variable.parameter.kotlin]
      - span: "y"
        nth: 0
        scopes: [variable.parameter.kotlin]
      - span: "&&"
        scopes: [keyword.operator.logical.kotlin, "- meta.type"]
      - span: "\"a\""
        scopes: [string.quoted.double.kotlin, "- meta.type"]
      - span: "'c'"
        scopes: [constant.character.kotlin]
      - span: "0"
        scopes: [constant.numeric.integer.decimal.kotlin]
      - span: "this"
        scopes: [variable.language.kotlin, "- support.type"]
      - span: "@"
        scopes: [punctuation.definition.label.kotlin, "- meta.annotation"]

  - prefix_lines: ["obj.call { e: Throwable ->"]
    line: "    flow { emit(e) }"
    assertions:
      - span: "flow"
        scopes: [variable.function.kotlin, "- meta.type"]
      - span: "{"
        scopes: [meta.lambda.kotlin meta.lambda.kotlin]

  - line: "}"
    assertions:
      - span: "}"
        scopes: [meta.lambda.kotlin, punctuation.section.block.end.kotlin]

  # A `{` inside call arguments starts a lambda.
  - line: "foo({ x: Int -> this@outer.bar(1) })"
    assertions:
      - span: "{"
        scopes: [meta.lambda.kotlin, punctuation.section.block.begin.kotlin]
      - span: "x"
        scopes: [variable.parameter.kotlin]
      - span: "->"
        scopes: [keyword.declaration.function.arrow.kotlin]
      - span: "this"
        scopes: [meta.lambda.kotlin, variable.language.kotlin]
      - span: "}"
        scopes: [meta.lambda.kotlin, punctuation.section.block.end.kotlin]
      - span: ")"
        nth: 1
        scopes: [punctuation.section.group.end.kotlin, "- meta.lambda"]

  - line: "foo(1, { e: Throwable -> flow { emit(1) } }, { it })"
    assertions:
      - span: "e"
        nth: 0
        scopes: [meta.lambda.kotlin, variable.parameter.kotlin]
      - span: "flow"
        scopes: [variable.function.kotlin]
      - span: "emit"
        scopes: [meta.lambda.kotlin meta.lambda.kotlin]
      - span: ","
        nth: 1
        scopes: [punctuation.separator.sequence.kotlin, "- meta.lambda"]
      - span: "it"
        nth: 1
        scopes: [meta.lambda.kotlin, variable.language.kotlin]

  - line: "foo(object : Runnable { override fun run() { a(1, 2) } }, { y -> y })"
    assertions:
      - span: "{"
        nth: 0
        scopes: [punctuation.section.block.begin.kotlin, "- meta.lambda"]
      - span: "fun"
        scopes: [keyword.declaration.function.kotlin, "- meta.lambda"]
      - span: "}"
        nth: 1
        scopes: [punctuation.section.block.end.kotlin, "- meta.lambda"]
      - span: "y"
        nth: 0
        scopes: [meta.lambda.kotlin, variable.parameter.kotlin]

  - prefix_lines: ["object Single {", "    fun f() { }"]
    line: "}"
    assertions:
      - span: "}"
        scopes: [punctuation.section.block.end.kotlin]

  - line: "val after = 1"
    assertions:
      - span: "val"
        scopes: [keyword.declaration.kotlin]
      - span: "1"
        scopes: [constant.numeric.integer.decimal.kotlin]

  # Local functions in a lambda: braces are balanced, with no meta.block.
  - prefix_lines: ["val w = run {"]
    line: "    fun stub() {"
    assertions:
      - span: "{"
        scopes: [meta.lambda.kotlin, punctuation.section.block.begin.kotlin, "- meta.block"]

  - line: "    }"
    assertions:
      - span: "}"
        scopes: [meta.lambda.kotlin, punctuation.section.block.end.kotlin, "- meta.block"]

  - line: "}"
    assertions:
      - span: "}"
        scopes: [meta.lambda.kotlin, punctuation.section.block.end.kotlin]

  - line: "fun top() {"
    assertions:
      - span: "{"
        scopes: ["- meta.lambda", "- meta.block"]

  - line: "}"
    assertions:
      - span: "}"
        scopes: ["- meta.lambda"]
